<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Catalogue</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font:16px/1.5 system-ui,Arial}header{background:#17365d;color:white;padding:24px 16px}header div,main,footer{max-width:1000px;margin:auto}h1{margin:0}main{padding:20px 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card,.detail{background:white;border:1px solid #e0e5ed;border-radius:14px;padding:16px}.card img{width:100%;height:180px;object-fit:contain}.card h2{font-size:18px}.muted{color:#667085;font-size:14px}.price{font-weight:750;color:#126b45;font-size:20px}a{color:#2356d8}.button{display:inline-block;background:#2356d8;color:white;text-decoration:none;padding:9px 12px;border-radius:8px}.search{width:100%;padding:12px;border:1px solid #ccd4e0;border-radius:10px;font:inherit;margin-bottom:16px}.detail{display:grid;grid-template-columns:minmax(150px,280px) 1fr;gap:22px}.detail img{width:100%;max-height:380px;object-fit:contain}.field{padding:8px 0;border-bottom:1px solid #edf0f4}.field b{display:inline-block;min-width:120px}footer{padding:20px;color:#667085;font-size:13px}@media(max-width:600px){.detail{grid-template-columns:1fr}}</style></head><body><header><div><h1>Book Catalogue</h1><p>Scan the QR code to view book details.</p></div></header><main id="app">Loading catalogue…</main><footer>Book details are provided by the publisher. Prices and editions may change.</footer><script>
const app=document.getElementById('app');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
fetch('./books.json').then(r=>r.json()).then(books=>{let id=new URLSearchParams(location.search).get('id'),b=books.find(x=>x.id===id);if(b){document.title=b.title+' — Book Details';app.innerHTML=`<a href="./">← All books</a><section class="detail" style="margin-top:14px"><img src="${esc(b.image)}" alt="Book cover" onerror="this.style.display='none'"><div><p class="muted">${esc(b.id)}</p><h2>${esc(b.title)}</h2><p class="price">${esc(b.price)}</p><div class="field"><b>Class:</b> ${esc(b.class)}</div><div class="field"><b>Publisher:</b> ${esc(b.publisher)}</div><div class="field"><b>Edition:</b> ${esc(b.edition)}</div><div class="field"><b>Language:</b> ${esc(b.language)}</div><div class="field"><b>Description:</b> ${esc(b.description)}</div></div></section>`}else{app.innerHTML='<input class="search" id="search" placeholder="Search title or book ID"><section class="grid" id="grid"></section>';let q=document.getElementById('search'),g=document.getElementById('grid');function draw(){g.innerHTML=books.filter(b=>(b.title+' '+b.id+' '+b.class).toLowerCase().includes(q.value.toLowerCase())).map(b=>`<article class="card"><img src="${esc(b.image)}" onerror="this.style.visibility='hidden'"><p class="muted">${esc(b.id)} · ${esc(b.class)}</p><h2>${esc(b.title)}</h2><p class="price">${esc(b.price)}</p><a class="button" href="?id=${encodeURIComponent(b.id)}">View details</a></article>`).join('')}q.oninput=draw;draw()}}).catch(()=>app.innerHTML='Could not load catalogue. Make sure books.json is uploaded beside index.html.');</script></body></html>
